<div class="card">
  <div class="card-body">
    <ul class="list-group">
      <li
        class="list-group-item d-flex justify-content-between align-items-center"
        *ngFor="let todo of getAllTodo"
      >
        <span>{{ todo.todoItem }}</span>

        <div>
          <button class="btn btn-sm btn-primary me-2 mr-1">Edit</button>

          <button class="btn btn-sm btn-danger">Delete</button>
        </div>
      </li>
    </ul>
  </div>
</div>
